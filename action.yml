name: mcp-spec
description: Run MCP server conformance and behavior tests, and fail the build on errors.
branding:
  icon: check-circle
  color: purple

inputs:
  command:
    description: Server command to run over stdio, e.g. `node dist/index.js`. Mutually exclusive with `url`.
    required: false
  url:
    description: Streamable HTTP endpoint of an already-running server. Mutually exclusive with `command`.
    required: false
  config:
    description: Path to an mcp.test.yaml. Used when neither `command` nor `url` is given.
    required: false
  conformance:
    description: strict | recommended | off
    required: false
  budget:
    description: Fail when tool definitions exceed this token estimate.
    required: false
  version:
    description: Git ref of mcp-spec to run — a tag, branch or commit sha.
    required: false
    default: main
  report:
    description: Path to write a JUnit XML report to. Empty disables it.
    required: false
    default: mcp-spec.xml

outputs:
  report:
    description: Path of the JUnit report, if one was written.
    value: ${{ inputs.report }}

runs:
  using: composite
  steps:
    - name: Run mcp-spec
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CONFORMANCE: ${{ inputs.conformance }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail

        if [ -n "$INPUT_COMMAND" ] && [ -n "$INPUT_URL" ]; then
          echo '::error::set either command or url, not both'
          exit 2
        fi

        # `if` rather than `[ ... ] && ...`: under `set -e` a trailing false
        # test is itself a failing command, so an empty optional input would
        # abort the whole step.
        args=()
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi
        if [ -n "$INPUT_CONFORMANCE" ]; then args+=(--conformance "$INPUT_CONFORMANCE"); fi
        if [ -n "$INPUT_BUDGET" ]; then args+=(--budget "$INPUT_BUDGET"); fi
        if [ -n "$INPUT_URL" ]; then args+=(--url "$INPUT_URL"); fi

        # Installed from git rather than npm. The package's `prepare` script
        # builds it on install, so this needs no published artifact — install
        # once here instead of letting each npx call re-clone.
        spec="github:dbc1234/mcp-spec#$INPUT_VERSION"
        tmp="$(mktemp -d)"
        npm install --prefix "$tmp" --no-save --silent "$spec"
        cli="$tmp/node_modules/.bin/mcp-spec"

        # The pretty report goes to the log; the JUnit file is written in a
        # second pass so both are available without re-running the server twice
        # in the common (passing) case.
        status=0
        if [ -n "$INPUT_COMMAND" ]; then
          "$cli" "${args[@]}" -- $INPUT_COMMAND || status=$?
        else
          "$cli" "${args[@]}" || status=$?
        fi

        if [ -n "$INPUT_REPORT" ]; then
          report_args=("${args[@]}" --reporter junit --out "$INPUT_REPORT")
          if [ -n "$INPUT_COMMAND" ]; then
            "$cli" "${report_args[@]}" -- $INPUT_COMMAND || true
          else
            "$cli" "${report_args[@]}" || true
          fi
        fi

        exit $status
